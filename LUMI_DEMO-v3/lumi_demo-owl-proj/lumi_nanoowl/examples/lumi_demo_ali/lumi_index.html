<html>
<head>

    <style>

        body {
            width: 100%;
            height: 100%;
        }

        #main_container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #logo_container {
            text-align: center;
        }

        #logo {
            height: 128px;
        }
        
        #prompt_input {
            width: 100%;
            font-size: 24px;
            margin-top: 16px;
        }

        #camera_image {
            width: 640px;
        }

        #result_box {
            margin-top: 16px;
            font-size: 18px;
            color: #333;
            background: #f0f0f0;
            padding: 8px;
            border-radius: 8px;
            width: 640px;
        }

    </style>

    <script type="text/javascript">

        function jpeg_binary_to_base64(buffer){
            var base64 = btoa(new Uint8Array(buffer).reduce(function (data, byte) {
                return data + String.fromCharCode(byte);
            }, ''));
            return "data:image/jpeg;base64," + base64;
        }

        var ws = undefined
        
        console.log(location.host);

        ws = new WebSocket("ws://" + location.host + "/ws");
        ws.binaryType = "arraybuffer";

        ws.onopen = function () {

            console.log("Connected.");

            var prompt_input = document.getElementById("prompt_input")

            function handle_prompt_change(event) {

                console.log("Sending prompt: " + event.target.value);

                if (typeof ws !== 'undefined') {
                    ws.send("prompt:" + event.target.value);
                }
            }

            prompt_input.oninput = handle_prompt_change;
        };

        ws.onclose = function () {
            console.log("Disconnected.");
        };

        let last_boxes = [];
        let last_labels = [];

        function draw_boxes_on_canvas(locs, labels) {
            var canvas = document.getElementById("canvas_box");
            var ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!locs || !labels) return;
            ctx.lineWidth = 2;
            ctx.font = "18px Arial";
            for (let i = 0; i < locs.length; ++i) {
                let box = locs[i];
                let label = labels[i];
                ctx.strokeStyle = "#FF0000";
                ctx.fillStyle = "rgba(255,0,0,0.3)";
                ctx.beginPath();
                ctx.rect(box[0], box[1], box[2]-box[0], box[3]-box[1]);
                ctx.stroke();
                ctx.fillRect(box[0], box[1], box[2]-box[0], box[3]-box[1]);
                ctx.fillStyle = "#FF0000";
                ctx.fillText(label, box[0]+2, box[1]+18);
            }
        }

        ws.onmessage = function (event) {
            if (typeof event.data === "string") {
                // 可选：显示检测结果文本
                try {
                    var result = JSON.parse(event.data);
                    var result_box = document.getElementById("result_box");
                    if (result.labels && result.locs && result.confs) {
                        let html = "<b>检测结果:</b><br/>";
                        for (let i = 0; i < result.labels.length; ++i) {
                            html += `目标${i+1}: 类别=${result.labels[i]}, 置信度=${result.confs[i].toFixed(2)}, 框=(${result.locs[i].join(", ")})<br/>`;
                        }
                        result_box.innerHTML = html;
                    }
                } catch (e) {}
            } else {
                // 只显示图片
                var camera_image = document.getElementById("camera_image");
                var blob = new Blob([event.data], {type: "image/jpeg"});
                var url = URL.createObjectURL(blob);
                camera_image.src = url;
            }
        }

    </script>
</head>
<body>
    <div id="main_container">
        <h1>Lumi Demo</h1>
        <div style="position:relative; width:640px; height:480px;">
            <img id="camera_image" src="" alt="Camera Image" style="position:absolute; left:0; top:0; z-index:1;"/>
            <canvas id="canvas_box" width="1280" height="800" style="position:absolute; left:0; top:0; z-index:2; pointer-events:none;"></canvas>
        </div>
        <br/>
        <!-- <input id="prompt_input" type="text" placeholder="[a face [an eye, a nose]]"/>
        <div id="result_box">检测结果将在此显示</div> -->
    </div>
</body>
</html>
